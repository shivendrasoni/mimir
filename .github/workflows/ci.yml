name: ci

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.target }})
    # A platform failure stays visible on its matrix row, but does not stop
    # healthy platforms or mark the aggregate workflow as failed.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --target "${{ matrix.target }}" -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --target "${{ matrix.target }}"
      - name: Build release
        run: cargo build --release --locked --target "${{ matrix.target }}"
