name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Version release
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Calculate next release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mimir-ai") | .version')"
          if [[ ! "$manifest_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Cargo.toml version must use major.minor.patch: $manifest_version"
            exit 1
          fi
          manifest_major="${BASH_REMATCH[1]}"
          manifest_minor="${BASH_REMATCH[2]}"
          manifest_patch="${BASH_REMATCH[3]}"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            release_version="$manifest_version"
          else
            tag_version="${latest_tag#v}"
            if [[ ! "$tag_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release tag is not semantic: $latest_tag"
              exit 1
            fi
            tag_major="${BASH_REMATCH[1]}"
            tag_minor="${BASH_REMATCH[2]}"
            if (( manifest_major < tag_major )); then
              echo "Cargo.toml major version $manifest_major is behind $latest_tag"
              exit 1
            fi
            if (( manifest_major > tag_major )); then
              if (( manifest_minor != 0 || manifest_patch != 0 )); then
                echo "Manual major releases must be declared as <major>.0.0"
                exit 1
              fi
              release_version="$manifest_version"
            else
              next_minor=$((tag_minor + 1))
              if (( manifest_minor > next_minor )); then
                next_minor="$manifest_minor"
              fi
              release_version="${manifest_major}.${next_minor}.0"
            fi
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"
          echo "Preparing v$release_version"
      - name: Update package and lockfile version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          release_version = os.environ["RELEASE_VERSION"]
          path = Path("Cargo.toml")
          lines = path.read_text().splitlines(keepends=True)
          in_package = False
          updated = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[package]":
                  in_package = True
                  continue
              if in_package and stripped.startswith("["):
                  break
              if in_package and stripped.startswith("version = "):
                  newline = "\n" if line.endswith("\n") else ""
                  lines[index] = f'version = "{release_version}"{newline}'
                  updated = True
                  break
          if not updated:
              raise SystemExit("Cargo.toml package version was not found")
          path.write_text("".join(lines))

          lock_path = Path("Cargo.lock")
          lock_text = lock_path.read_text()
          lock_text, replacements = re.subn(
              r'(?m)(^name = "mimir-ai"\nversion = ")[^"]+("$)',
              rf'\g<1>{release_version}\g<2>',
              lock_text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Cargo.lock mimir-ai package version was not found")
          lock_path.write_text(lock_text)
          PY
      - name: Validate synchronized lockfile
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Create tagged release commit
        id: commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- Cargo.toml Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
          fi
          git tag -a "$TAG_NAME" -m "Mimir $TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "Mimir $TAG_NAME" \
              --generate-notes
          fi

  build-and-publish:
    name: Build and publish ${{ matrix.target }}
    needs: prepare
    # Each target owns its artifact. A failure is isolated to this matrix row.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked --target "${{ matrix.target }}" -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked --target "${{ matrix.target }}"
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        env:
          ARCHIVE_TYPE: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="target/$TARGET/release/mimir"
          archive_name="mimir-${TAG_NAME}-${TARGET}"
          if [[ "$ARCHIVE_TYPE" == "zip" ]]; then
            cp "$binary" "dist/mimir"
            (cd dist && 7z a -tzip "${archive_name}.zip" "mimir")
          else
            tar -C "target/$TARGET/release" -czf "dist/${archive_name}.tar.gz" "mimir"
          fi
          archive="dist/${archive_name}.${ARCHIVE_TYPE}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Upload platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
