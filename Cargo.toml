[package]
name = "mimir-ai"
version = "0.14.0"
edition = "2024"
rust-version = "1.97"
description = "A fast, memory-efficient agentic harness"
license = "MIT"
repository = "https://github.com/shivendrasoni/mimir"
readme = "README.md"
keywords = ["ai", "agent", "cli", "coding-assistant", "llm"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mimir"
path = "src/lib.rs"

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
dotenvy = "0.15"
futures = "0.3"
hmac = "0.12"
regex = "1.11"
oxc_allocator = "=0.132.0"
oxc_codegen = { version = "=0.132.0", default-features = false }
oxc_parser = "=0.132.0"
oxc_semantic = "=0.132.0"
oxc_span = "=0.132.0"
oxc_transformer = "=0.132.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rquickjs = { version = "=0.12.1", default-features = false, features = ["std", "loader"] }
ring = "0.17"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tempfile = "3.20"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
